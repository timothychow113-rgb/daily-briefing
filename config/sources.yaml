# Which sources to collect from. Edit freely; no code changes needed.

gmail:
  enabled: true           # skipped with a message until GMAIL_* secrets exist
  account: tchow29@amherst.edu
  label: briefing         # Gmail label your newsletter filter applies
  lookback_hours: 36

rss:
  enabled: true
  lookback_hours: 36
  max_items_per_feed: 20
  # Starter list. Not yet verified: run `python -m briefing check-feeds` (or the
  # "check feeds" GitHub Action) and remove any that fail or give thin text.
  # type: news | press_release | filing   fetch_full_text: follow the link (robots.txt respected)
  feeds:
    - name: Federal Reserve
      url: https://www.federalreserve.gov/feeds/press_all.xml
      type: press_release
    - name: DatacenterDynamics
      url: https://www.datacenterdynamics.com/en/rss/
      type: news
      fetch_full_text: true
    - name: Data Center Frontier
      url: https://www.datacenterfrontier.com/rss
      type: news
      fetch_full_text: true
    - name: Utility Dive
      url: https://www.utilitydive.com/feeds/news/
      type: news
      fetch_full_text: true
    - name: SemiAnalysis
      url: https://newsletter.semianalysis.com/feed
      type: news
    - name: Stratechery
      url: https://stratechery.com/feed/
      type: news

edgar:
  enabled: false
  forms: ["8-K", "S-1", "DEFM14A", "SC TO-T"]
  watchlist: []           # tickers or CIKs

limits:
  max_chars_per_item: 20000
  max_selected_stories: 10
